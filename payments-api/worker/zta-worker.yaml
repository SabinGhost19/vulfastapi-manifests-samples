apiVersion: devsecops.licenta.ro/v1
kind: ZeroTrustApplication
metadata:
  name: payments-worker
  namespace: default
spec:
  image: ghcr.io/sabinghost19/payments-worker@sha256:bcceae35d2ac06804ed952bfaa2342202a1d3ce2e93ca1e6c122d0102be782df
  replicas: 2
  securityPolicyRef:
    name: payments-strict-policy
  networkZeroTrust:
    # Worker has no inbound; only outbound to DB + message queue.
    egressAllowedTo:
      - namespace: database
        ports: [5432]
      - namespace: kafka
        ports: [9092]
  runtimeSecurity:
    allowedPaths:
      - /tmp
      - /var/run
    onCompromise: Isolate
