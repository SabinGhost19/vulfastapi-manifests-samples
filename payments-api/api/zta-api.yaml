apiVersion: devsecops.licenta.ro/v1
kind: ZeroTrustApplication
metadata:
  name: payments-api
  namespace: default
spec:
  # Replaced by the bump-manifests CI job after each pipeline run.
  image: ghcr.io/sabinghost19/payments-api@sha256:8afa818a6f9819e6da4cc76c97d0542ec4417c069d3eaa6551b001e6a620e784
  replicas: 2
  securityPolicyRef:
    name: payments-strict-policy
  networkZeroTrust:
    ingressAllowedFrom:
      - namespace: api-gateway
    egressAllowedTo:
      - namespace: database
        ports: [5432]
  runtimeSecurity:
    allowedPaths:
      - /tmp
      - /var/run
    onCompromise: Isolate
