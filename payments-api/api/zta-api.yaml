apiVersion: devsecops.licenta.ro/v1
kind: ZeroTrustApplication
metadata:
  name: payments-api
  namespace: default
spec:
  # Replaced by the bump-manifests CI job after each pipeline run.
  image: ghcr.io/sabinghost19/payments-api@sha256:51df037df38f00f86c1abd26f84c568c98e37d38424ebe9823806d865ceaa038
  replicas: 2
  securityPolicyRef:
    name: payments-strict-policy
  networkZeroTrust:
    ingressAllowedFrom:
      - namespace: api-gateway
    egressAllowedTo:
      - namespace: database
        ports: [5432]
  runtimeSecurity:
    allowedPaths:
      - /tmp
      - /var/run
    onCompromise: Isolate
