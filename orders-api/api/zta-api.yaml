apiVersion: devsecops.licenta.ro/v1
kind: ZeroTrustApplication
metadata:
  name: orders-api
  namespace: default
spec:
  # Placeholder digest — replaced by the bump-manifests CI job after each run.
  image: ghcr.io/sabinghost19/orders-api@sha256:3287dfa50787c08acd77425012ecdc055bd47e4fbb98b9d61cb10c1413ddc11e
  replicas: 2
  securityPolicyRef:
    name: orders-verified-policy
  networkZeroTrust:
    ingressAllowedFrom:
      - namespace: api-gateway
    egressAllowedTo:
      - namespace: database
        ports: [5432]
  runtimeSecurity:
    allowedPaths:
      - /tmp
      - /var/run
    onCompromise: Isolate
