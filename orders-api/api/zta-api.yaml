apiVersion: devsecops.licenta.ro/v1
kind: ZeroTrustApplication
metadata:
  name: orders-api
  namespace: default
spec:
  # Placeholder digest — replaced by the bump-manifests CI job after each run.
  image: ghcr.io/sabinghost19/orders-api@sha256:a2540b9d20159c761157beced87914a6fd46303f72c3e3c93306dfc870e29e5b
  replicas: 2
  securityPolicyRef:
    name: orders-verified-policy
  networkZeroTrust:
    ingressAllowedFrom:
      - namespace: api-gateway
    egressAllowedTo:
      - namespace: database
        ports: [5432]
  runtimeSecurity:
    allowedPaths:
      - /tmp
      - /var/run
    onCompromise: Isolate
