apiVersion: devsecops.licenta.ro/v1
kind: SupplyChainAttestation
metadata:
  name: demo-app-security-policy
spec:
  sourceValidation:
    enforceCosign: true
    trustedIssuers:
      - https://github.com/SabinGhost19/vulfastapi/.github/workflows/ci-cd.yaml@refs/heads/main
  provenance:
    requireVoucher: true
    enforceHmacChain: true
    minSlsaLevel: 3
    trustedRepositories:
      - SabinGhost19/vulfastapi
  vulnerabilityPolicy:
    maxAllowedSeverity: High
    failOnFixable: true
  sbomPolicy:
    enforceSBOM: true
    forbiddenPackages:
      - name: log4j
        maxVersion: "2.15.0"
  policyBinding:
    enabled: true
    requireAttestationType: https://devsecops.licenta.ro/attestations/custom-zta-policy/v1
  strictManifestHash:
    enabled: true
    enforcementAction: Reject
  # SLSA v1.0 provenance attestation (predicate type
  # https://slsa.dev/provenance/v1, cosign --type slsaprovenance1).
  # Pipeline-ul folosește slsa-github-generator/generator_container_slsa3@v2.0.0,
  # care setează builder.id = URL-ul workflow-ului generator.
  # `allowedBuildTypes` este lăsat gol intenționat: valoarea buildType
  # variază între minor versions ale generatorului (v0.1 / v1 / workflow/v1)
  # și fac filtrul deja prin trustedBuilders (URL-ul e stabil).
  slsaProvenancePolicy:
    enforceSlsa: true
    requiredLevel: 3
    trustedBuilders:
      - "https://github.com/slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@refs/tags/v2.0.0"
  # OpenVEX v0.2.0 signed attestation (predicate type
  # https://openvex.dev/ns/v0.2.0). Independent of the Trivy-exemption
  # path; this enforces that a signed OpenVEX statement document exists.
  openVexPolicy:
    enforceOpenVex: true
    requireStatements: true
  runtimeEnforcement:
    enabled: true
    onPolicyDrift: Isolate
    onVulnerabilityFound: Alert
  # CEL-based dynamic rules (new in v0.2). Each expression is evaluated
  # against a uniform context: {voucher, image, zta, vex, sbom}.
  # action semantics:
  #   Deny  -> expression == true means violation (blocking).
  #   Allow -> expression == false means required condition failed.
  #   Alert -> expression == true emits Warning Event, non-blocking.
  customRules:
    - name: require-slsa-level-3
      description: VBBI voucher must declare SLSA Build L3 or higher
      expression: "voucher.build_context.slsa_level >= 3"
      action: Allow
    - name: deny-non-ghcr-images
      description: Only images from the official GHCR registry are allowed
      expression: "!image.startsWith('ghcr.io/')"
      action: Deny
    - name: alert-large-sbom
      description: Surface a warning when SBOM exceeds 500 packages
      expression: "size(sbom.packages) > 500"
      action: Alert
