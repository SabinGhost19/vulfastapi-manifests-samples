apiVersion: devsecops.licenta.ro/v1
kind: ZeroTrustApplication
metadata:
  name: demo-api
  namespace: default
spec:
  image: ghcr.io/sabinghost19/demo-vulnerable-fastapi@sha256:f78058e562c219252a8240f3a7ea0a450f472e930589e35fe7c8674ac4881373
  replicas: 2
  securityPolicyRef:
    name: demo-app-security-policy
