apiVersion: devsecops.licenta.ro/v1
kind: ZeroTrustApplication
metadata:
  name: demo-api
  namespace: default
spec:
  image: ghcr.io/sabinghost19/demo-vulnerable-fastapi@sha256:3e7bfd1a1a5bfdead0fa4cfecb665d3bca27ea7fe230abde3070226ea86e3998
  replicas: 2
  securityPolicyRef:
    name: demo-app-security-policy
  networkZeroTrust:
