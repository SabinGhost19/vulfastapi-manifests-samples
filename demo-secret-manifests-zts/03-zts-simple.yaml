apiVersion: devsecops.licenta.ro/v1
kind: ZeroTrustSecret
metadata:
  name: demo-api-db-secret-simple
  namespace: default
spec:
  targetWorkload:
    kind: Deployment
    name: demo-api
    namespace: default
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  targetSecretName: demo-api-db-secret
  secretData:
    remotePath: prod/demo-api/config
    mapping:
      - remoteKey: password
        localKey: DB_PASSWORD
        type: EnvVar
      - remoteKey: username
        localKey: DB_USERNAME
        type: EnvVar
  zeroTrustConditions:
    requireVerifiedStatus: false
  lifecycle:
    refreshInterval: 1m
    onUpdateAction: RollingRestart
