apiVersion: devsecops.licenta.ro/v1
kind: SupplyChainAttestation
metadata:
  name: analytics-relaxed-policy
spec:
  sourceValidation:
    enforceCosign: true
    # Pipeline split into per-job reusable workflows: cosign keyless SAN is now
    # the job-*.yml that signs. The operator loops over this list (OR), so both
    # new identities are listed (attestations + image signature).
    trustedIssuers:
      - https://github.com/SabinGhost19/analytics-engine-demo/.github/workflows/job-attestations.yml@refs/heads/main
      - https://github.com/SabinGhost19/analytics-engine-demo/.github/workflows/job-sign.yml@refs/heads/main
      # Legacy monolithic identity (unused once the split pipeline has run):
      # - https://github.com/SabinGhost19/analytics-engine-demo/.github/workflows/ci-cd.yaml@refs/heads/main
  provenance:
    requireVoucher: true
    enforceHmacChain: true
    minSlsaLevel: 3
    trustedRepositories:
      - SabinGhost19/analytics-engine-demo
  vulnerabilityPolicy:
    maxAllowedSeverity: High
    failOnFixable: false           # tolerăm fixable pe analytics-api → Alert
  sbomPolicy:
    enforceSBOM: true
  policyBinding:
    enabled: true
  strictManifestHash:
    enabled: true
    enforcementAction: Alert       # audit, nu Reject
  slsaProvenancePolicy:
    enforceSlsa: true
    requiredLevel: 3
    trustedIssuers:
      - "https://github.com/slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@refs/tags/v2.0.0"
    trustedBuilders:
      - "https://github.com/slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@refs/tags/v2.0.0"
  openVexPolicy:
    enforceOpenVex: true
    requireStatements: false
  # OSS security-scan attestation (gitleaks/checkov/semgrep -> security-scan/v1).
  # relaxed variant: secrets still block, IaC/SAST only block at Critical.
  securityScanPolicy:
    enforceSecurityScan: true
    requireAttestation: false
    failOnSecrets: true
    maxIacSeverity: Critical
    maxSastSeverity: Critical
  runtimeEnforcement:
    enabled: true
    onPolicyDrift: Alert
    onVulnerabilityFound: Alert    # vulnerabilități tolerate cu warning
  customRules:
    - name: require-slsa-l3
      expression: "voucher.build_context.slsa_level >= 3"
      action: Allow
